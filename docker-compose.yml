services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tableskull
      POSTGRES_USER: tableskull
      POSTGRES_PASSWORD: tableskull
    ports:
      - "5432:5432"
    volumes:
      - tableskull-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tableskull -d tableskull"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tableskull-postgres: